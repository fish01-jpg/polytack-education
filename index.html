<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poly Track Classroom</title><style>
:root {
  --bg:#111827; --panel:#1f2937; --panel2:#273449;
  --text:#f3f4f6; --muted:#aab6c8; --accent:#8b5cf6;
  --accent2:#06b6d4; --good:#34d399; --bad:#fb7185;
  --border:#475569;
}
*{box-sizing:border-box}
body{margin:0;background:transparent;color:var(--text);
font:15px/1.45 system-ui,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;background:var(--panel2);color:var(--text);
border:1px solid var(--border);padding:9px 13px;border-radius:10px}
button:hover{filter:brightness(1.15)}
button.primary{background:var(--accent);border-color:transparent;font-weight:700}
button:disabled{opacity:.7;cursor:default}
#launcher{position:fixed;right:20px;top:20px;z-index:99999}
#app{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);right:auto;width:min(460px,calc(100vw - 24px));
max-height:calc(100vh - 30px);overflow:hidden;background:var(--bg);
border:1px solid var(--border);border-radius:17px;z-index:99999;
box-shadow:0 18px 55px #0009;display:none;flex-direction:column}
#app.open{display:flex}
/* the panel scrolls INSIDE main, so the corner buttons stay pinned */
#app main{flex:1 1 auto;min-height:0;overflow:auto}
.topbar{display:flex;justify-content:space-between;align-items:center;
padding:12px 15px;background:linear-gradient(120deg,var(--accent),#4338ca);
position:sticky;top:0;z-index:2;cursor:move}
.brand{font-weight:850}
.top-actions{display:flex;gap:5px}
.top-actions button{padding:4px 9px;background:#ffffff20}
main{padding:15px}
.hidden{display:none!important}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px}
.eyebrow{color:var(--accent2);font-size:11px;font-weight:800;letter-spacing:1px;margin-top:10px}
.question{font-size:20px;font-weight:750;line-height:1.3;margin:8px 0 15px}
.answers{display:grid;gap:8px}
.answer{display:flex;align-items:center;text-align:left;gap:10px;background:var(--panel);width:100%}
.letter{display:grid;place-items:center;flex:0 0 27px;height:27px;border-radius:8px;background:#ffffff15;font-weight:800}
.answer.correct{border-color:var(--good);background:#064e3b}
.answer.wrong{border-color:var(--bad);background:#881337}
.feedback{margin-top:10px;padding:10px;border-radius:10px;background:var(--panel2);color:var(--muted)}
.progress{height:5px;background:#ffffff18;border-radius:9px;overflow:hidden;margin:12px 0}
.progress span{height:100%;width:0;display:block;background:var(--accent2)}
.footer,.row{display:flex;gap:8px;margin-top:14px}
.footer>* ,.row>*{flex:1;min-width:0}
.small{font-size:12px;color:var(--muted);margin-top:10px}
.key{font-family:monospace;background:#ffffff18;border:1px solid var(--border);padding:2px 4px;border-radius:4px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:15px}
.field{display:grid;gap:5px;margin:10px 0}
.field label{font-size:12px;color:var(--muted);font-weight:700}
.field input:not([type=checkbox]),.field select,.field textarea{
width:100%;min-width:0;padding:9px;border:1px solid var(--border);
border-radius:8px;background:#0b1220;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);padding:10px;border-radius:10px;text-align:center}
.stat strong{display:block;font-size:21px}
.stat span{font-size:11px;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
z-index:100001;background:#111827;color:white;border:1px solid #64748b;
border-radius:10px;padding:10px 15px;display:none;max-width:90vw}
body.quiz-blocked,body.quiz-blocked *{cursor:auto!important}
body.compact #app{width:min(350px,calc(100vw - 24px))}
body.compact main{padding:11px}
body.compact .question{font-size:17px}
body.light{--bg:#f8fafc;--panel:#e2e8f0;--panel2:#cbd5e1;
--text:#0f172a;--muted:#475569;--border:#94a3b8}
body.neon{--bg:#090b18;--panel:#11152b;--panel2:#1a2140;
--text:#e0f2fe;--muted:#94a3b8;--border:#4c1d95;
--accent:#d946ef;--accent2:#22d3ee}
@media(max-width:500px){#app{right:10px;top:60px;max-height:calc(100vh - 70px)}#launcher{right:10px;top:10px}}

/* Keep the quiz fully centered and readable on every screen size. */
#app{left:50%!important;top:50%!important;right:auto!important;bottom:auto!important;transform:translate(-50%,-50%)!important;max-height:calc(100vh - 24px)!important;width:min(460px,calc(100vw - 24px))!important}

/* While a question is on screen, cover the WHOLE screen so the track is hidden. */
body.quiz-blocked #app{left:0!important;top:0!important;right:0!important;bottom:0!important;transform:none!important;width:100vw!important;height:100vh!important;max-height:none!important;border-radius:0;display:flex!important;flex-direction:column;align-items:center;overflow:auto;background:var(--bg)}
body.quiz-blocked .topbar{width:100%}
body.quiz-blocked #app main{margin:auto;width:min(520px,92vw)}
body.quiz-blocked .top-actions{display:none!important}
.answer{padding:13px;font-size:16px}

/* Classroom lock: nobody can race until they've joined a class AND the
   teacher has turned Classroom mode on. Same full-screen takeover as a question. */
body.race-locked #app{left:0!important;top:0!important;right:0!important;bottom:0!important;transform:none!important;width:100vw!important;height:100vh!important;max-height:none!important;border-radius:0;display:flex!important;flex-direction:column;align-items:center;overflow:auto;background:var(--bg)}
body.race-locked .topbar{width:100%}
body.race-locked #app main{margin:auto;width:min(480px,92vw)}
/* Leave class stays reachable in the top-right even while locked */
body.race-locked,body.race-locked *{cursor:auto!important}

.tabs{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1}
.tab.active{background:var(--accent);border-color:transparent;font-weight:700}
.linklike{background:none;border:none;padding:0;color:var(--accent2);text-decoration:underline}
.classrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

/* Class shadow radar: shows the best student's ghost while you race */
#shadowHud{position:fixed;right:14px;bottom:14px;z-index:99998;background:#0f172aee;
border:1px solid var(--border);border-radius:14px;padding:10px 12px;text-align:center;
font-size:12px;color:var(--text);max-width:210px;display:none}
#shadowHud.show{display:block}
#shadowHud canvas{display:block;margin:6px auto 2px;background:#0b1220;border-radius:8px}
#shadowDelta{font-weight:700}
/* Top-left in-race HUD: attempts left + ability readiness. */
#raceHud{position:fixed;left:14px;top:14px;z-index:1000000;background:#0f172aee;
border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:12px;
color:var(--text);line-height:1.6;display:none;pointer-events:none;max-width:230px}
#raceHud.show{display:block}
#raceHud b{font-weight:700}
#raceHud .dim{opacity:.45}
#raceHud .good{color:var(--good)}
/* The game's own top button bar (div.editor > div.top > div.button-bar,
   68px tall, opaque background) moves to the BOTTOM-left so the classroom
   HUD owns the top-left corner. */
#ui>.top,.editor>.top,.ui>.top{position:absolute!important;left:0!important;bottom:0!important;top:auto!important;right:auto!important;width:auto!important;max-width:80vw!important}
</style></head><body class="hide-cursor"><module>
